[tool.poetry]
name = "oversampleqa"
version = "0.1.0"
description = "A diagnostic toolkit to validate oversampling methods."
authors = ["Diogo Ribeiro <dfr@esmad.ipp.pt>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "oversampleqa", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.10"
numpy = "^1.21.0"
pandas = "^2.3.0"
scikit-learn = "^1.0.0"
imbalanced-learn = "^0.13.0"
matplotlib = "^3.5.0"
seaborn = "^0.11.0"
umap-learn = "^0.5.0"
jinja2 = "^3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^6.0.0"
pytest-cov = "^6.3.0"
black = "^22.0.0"
flake8 = "^7.3.0"
mypy = "^0.950"
sphinx = "^7.0.0"
myst-parser = "^2.0.0"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.poetry.scripts]
oversampleqa-validate = "oversampleqa.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
