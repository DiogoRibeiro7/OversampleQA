[tool.poetry]
name = "oversampleqa"
version = "0.2.0"
description = "A diagnostic toolkit to validate oversampling methods."
authors = ["Diogo Ribeiro <dfr@esmad.ipp.pt>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "oversampleqa", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.10"
numpy = "^2.2.6"
pandas = "^2.3.0"
scikit-learn = "^1.0.0"
imbalanced-learn = "^0.14.0"
matplotlib = "^3.5.0"
seaborn = "^0.13.2"
umap-learn = "^0.5.0"
jinja2 = "^3.0.0"
click = "^8.1.7"
rich = ">=14.2,<16.0"
pyyaml = "^6.0.2"
pydantic = "^2.9.2"
# Resolves the per-user cache directory. The cache falls back to
# ~/.cache/oversampleqa if this is absent, so it is not a hard requirement.
platformdirs = ">=3.0"
# Runtime, not test-only. advanced_benchmark imports scipy.stats at module
# level and inference.py needs scipy.sparse.csgraph, so the package cannot be
# imported without it. It was briefly declared dev-only, which was wrong.
scipy = "^1.14"
# Optional. psutil lets the memory-aware batching read the real available
# memory instead of assuming 1 GB; tqdm adds progress bars.
psutil = { version = ">=5.9", optional = true }
tqdm = { version = ">=4.66", optional = true }

[tool.poetry.extras]
performance = ["psutil", "tqdm"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
ruff = ">=0.15,<0.17"
bandit = "^1.7.9"
mypy = ">=1.18,<3.0"
pre-commit = "^4.3.0"
safety = "^3.2.7"
commitizen = "^4.1.1"
sphinx = "^8.1.3"
myst-parser = "^4.0.1"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# An explicit, enforced rule set. There was no ruff configuration at all before,
# so the project inherited whatever the installed version happened to default
# to -- which is how a backlog of ~270 findings accumulated that nobody was
# expected to clear. A small set that CI actually enforces is worth more than a
# large aspirational one.
select = [
    "F",    # pyflakes: real errors -- undefined names, unused imports
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade: keep syntax current with the 3.10 floor
    "B",    # bugbear: likely bugs
    "C4",   # comprehension simplifications
    "SIM",  # obvious simplifications
    "RUF",  # ruff's own checks
    "TRY",  # exception-handling antipatterns
]
ignore = [
    # Broad `except Exception` is deliberate at the boundaries where it appears:
    # the optional-matplotlib import guard, per-fold benchmark failures that must
    # not abort a sweep, and the CLI's top-level handler. Every one logs or warns
    # rather than swallowing. Narrowing them would mean enumerating the exception
    # types of third-party samplers, which is not knowable.
    "BLE001",
    # `import X as X` is the explicit re-export idiom (PEP 484). types.py uses it
    # to keep `from oversampleqa.types import ValidationError` working now that
    # the hierarchy lives in exceptions.py.
    "PLC0414",
    # Long messages inside raise statements are more readable inline than
    # assigned to a variable first, and this codebase's errors are deliberately
    # explanatory.
    "TRY003",
    "EM101",
    "EM102",
    # Extracting a raise into an inner function to satisfy a linter makes the
    # control flow harder to follow, not easier.
    "TRY301",
    # `logging.exception` already records the traceback, but naming the error in
    # the message keeps the log line self-contained when the traceback is
    # collapsed.
    "TRY401",
    # A `return` at the end of a `try` is clearer than an `else:` block when the
    # try body is short.
    "TRY300",
    # A ternary is not always more readable than the if/else it replaces.
    "SIM108",
    # En dashes in prose docstrings are intentional typography.
    "RUF002",
    # `callable(cls)` is True for every class, so probing the `__call__`
    # attribute is the correct test when asking whether *instances* are
    # callable. See plugin_system.implements_metric.
    "B004",
    # Line length is enforced by `ruff format`, which reflows what it can. The
    # residue is long string literals and URLs that cannot be split without
    # hurting readability.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately reach into private helpers to pin internal invariants.
"tests/*" = ["SLF001"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = true

# `strict = true` applies everywhere. The numerical core -- validator,
# distance, extended_distances, optimized_distance, metrics, caching, types,
# exceptions, _rng -- is fully strict with no exemptions, because those are the
# modules whose types encode the maths.
#
# The modules below are exempted from specific codes, each for a stated reason.
# These are scoped relaxations, not blanket suppression: the code list is
# explicit, so a *new* class of error in these files still fails.

[[tool.mypy.overrides]]
# The CLI marshals untyped pandas/click values at the boundary: DataFrame
# column access returns Any, and click passes options as Any. Typing that
# faithfully would mean casting at every call site without catching real bugs.
module = "oversampleqa.cli_enhanced"
disable_error_code = ["arg-type", "no-any-return", "assignment", "index"]

[[tool.mypy.overrides]]
# scikit-learn ships no type stubs, so BaseEstimator is Any and subclassing it
# is an error under strict mode. The estimator's own surface is fully annotated.
module = "oversampleqa.estimator"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
# matplotlib has no bundled stubs, so every axes/figure call is Any.
module = "oversampleqa.plotting"
disable_error_code = ["no-any-return", "arg-type", "union-attr"]

[[tool.mypy.overrides]]
# pandas groupby/agg returns are typed loosely upstream; DataFrame vs Series
# cannot be distinguished statically through .agg().
module = ["oversampleqa.benchmark", "oversampleqa.advanced_benchmark"]
disable_error_code = ["return-value", "no-any-return", "type-arg", "arg-type"]

[[tool.mypy.overrides]]
# Plugin entry points accept arbitrary user callables by design; their
# signatures are validated at runtime, not statically.
module = ["oversampleqa.plugin_system", "oversampleqa.surrogate"]
disable_error_code = ["no-untyped-def", "no-any-return"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
tag_format = "v$version"
update_changelog_on_bump = true

[tool.poetry.scripts]
oversampleqa-validate = "oversampleqa.cli:main"
oversampleqa = "oversampleqa.cli_enhanced:main"

[tool.pytest.ini_options]
markers = [
    "slow: measures memory or timing; slower and more environment-sensitive",
]
filterwarnings = [
    "ignore:importing 'Const' from 'astroid' is deprecated.*:DeprecationWarning:asttokens.util",
    "ignore:.*The `disp` and `iprint` options of the L-BFGS-B solver are deprecated.*:DeprecationWarning",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
