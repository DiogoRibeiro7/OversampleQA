name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # Development happens on Windows, so Windows is in the matrix rather than
    # being tested only by accident. Running every Python version on both
    # platforms would double CI time for little signal, so Windows is covered
    # on one version -- enough to catch path handling and shell assumptions,
    # which is where the cross-platform breakage actually lives.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      # poetry is pinned and the lock is verified: an unpinned poetry with no
      # committed lock silently re-resolved every dependency on every run, so
      # nothing guaranteed two runs tested the same versions.
      run: |
        python -m pip install --upgrade pip
        pip install "poetry==2.4.1"
        poetry check --lock
        poetry install --with dev

    - name: Run tests
      run: poetry run pytest --cov=oversampleqa --cov-report=xml

    - name: Test the reference plugin
      # Installed after the main suite so it cannot alter that environment.
      # This is the only step that exercises real entry-point discovery; the
      # tests in tests/ use synthetic entry points and would not catch a broken
      # pyproject.toml here.
      run: |
        poetry run pip install -e examples/plugins
        poetry run pytest examples/plugins/tests -q
    
    - name: Upload coverage
      # One upload is enough; the Windows job would only duplicate it.
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v7

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: |
          docs/requirements.txt
          poetry.lock
    - name: Install pandoc
      # nbsphinx shells out to pandoc to render the .ipynb tutorials; without it
      # the build dies with PandocMissing.
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "poetry==2.4.1"
        poetry check --lock
        poetry install --with dev
        poetry run pip install -r docs/requirements.txt
    - name: Sync gallery examples
      run: poetry run python scripts/sync_gallery_examples.py
    - name: Build docs (warnings as errors)
      run: poetry run sphinx-build -b html docs docs/_build/html -W
