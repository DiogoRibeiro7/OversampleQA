name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Pinned in one place rather than repeated in four install blocks.
  POETRY_VERSION: "2.4.1"
  # Poetry's own cache and the project virtualenv are put inside the
  # workspace so a single path works on Windows as well as Linux -- the
  # defaults differ (~/.cache/pypoetry against %LOCALAPPDATA%\pypoetry\Cache).
  POETRY_CACHE_DIR: ${{ github.workspace }}/.poetry-cache
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  quality:
    # README.md and ROADMAP.md both state that `ruff check` and `mypy src` pass
    # clean. Nothing enforced that: CI ran tests and docs only, so the claim
    # held only for as long as every contributor remembered to run them by
    # hand. One job, one Python version -- neither tool's result varies across
    # the matrix.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Cache the Poetry environment
      uses: actions/cache@v4
      with:
        path: |
          .poetry-cache
          .venv
        key: poetry-${{ runner.os }}-py3.12-dev-${{ hashFiles('poetry.lock') }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "poetry==${{ env.POETRY_VERSION }}"
        poetry check --lock
        poetry install --with dev
    - name: Lint
      # `scripts` included: it was unchecked, and had accumulated nine
      # lint errors nobody could see because the gate never looked there.
      run: poetry run ruff check src tests scripts examples
    - name: Type check
      run: poetry run mypy src

  test:
    # Development happens on Windows, so Windows is in the matrix rather than
    # being tested only by accident. Running every Python version on both
    # platforms would double CI time for little signal, so Windows is covered
    # on one version -- enough to catch path handling and shell assumptions,
    # which is where the cross-platform breakage actually lives.
    #
    # The full matrix runs on push to main. A pull request runs one job.
    #
    # Measured on a recent PR, the four test jobs were the whole cost: the
    # suite takes ~117s on Linux and ~148s on Windows, against ~30s to install
    # and ~10s for lint and mypy together. Running it four times bought a
    # version-specific signal that has, in practice, almost never differed from
    # the 3.12 result -- so it now runs once before merge and in full on main,
    # where a 3.10-only or Windows-only break is still caught, just after the
    # merge rather than before it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"os":"ubuntu-latest","python-version":"3.12"}]'
          || '[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"windows-latest","python-version":"3.12"}]') }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    # Restore and save are split rather than using actions/cache, which writes
    # its cache in a post-job step. "Test the reference plugin" below installs
    # into this virtualenv, so a cache written at the end of the job would
    # carry the plugin into the next run -- where the main suite is meant to
    # start without it, that being the whole point of installing it last.
    # Saving here, before the tests, keeps the cached environment clean.
    - name: Restore the Poetry environment
      id: poetry-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          .poetry-cache
          .venv
        key: >-
          poetry-${{ runner.os }}-py${{ matrix.python-version }}-dev-${{
          hashFiles('poetry.lock') }}

    - name: Install dependencies
      # poetry is pinned and the lock is verified: an unpinned poetry with no
      # committed lock silently re-resolved every dependency on every run, so
      # nothing guaranteed two runs tested the same versions.
      run: |
        python -m pip install --upgrade pip
        pip install "poetry==${{ env.POETRY_VERSION }}"
        poetry check --lock
        poetry install --with dev

    - name: Save the Poetry environment
      # Same key as the restore above; Actions has no anchors to share it.
      if: steps.poetry-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          .poetry-cache
          .venv
        key: >-
          poetry-${{ runner.os }}-py${{ matrix.python-version }}-dev-${{
          hashFiles('poetry.lock') }}

    - name: Run tests
      run: poetry run pytest --cov=oversampleqa --cov-report=xml

    - name: Test the reference plugin
      # Installed after the main suite so it cannot alter that environment.
      # This is the only step that exercises real entry-point discovery; the
      # tests in tests/ use synthetic entry points and would not catch a broken
      # pyproject.toml here.
      run: |
        poetry run pip install -e examples/plugins
        poetry run pytest examples/plugins/tests -q
    
    - name: Upload coverage
      # One upload is enough; the Windows job would only duplicate it.
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v7

  package-smoke:
    # Source-tree tests can pass while the built wheel is broken: missing
    # package data, undeclared runtime dependencies, or console scripts that
    # only work in an editable install. Build the wheel and exercise it from a
    # clean virtual environment before merge.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    # Deliberately uncached. This job runs `pip install poetry` and
    # `poetry build`; it never installs project dependencies, so Poetry's
    # download cache is never read. Measured with a cache step here, the job
    # went from 77s to 81s -- a key that costs a little and returns nothing,
    # which is what the pip keys this change removed were already doing.
    - name: Build package
      run: |
        python -m pip install --upgrade pip
        pip install "poetry==${{ env.POETRY_VERSION }}"
        poetry check --lock
        poetry build
    - name: Smoke test installed wheel
      run: python scripts/smoke_installed_package.py dist/*.whl

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Cache the Poetry environment
      # Keyed separately from the other jobs: this one installs the docs group
      # too, so sharing their key would restore a virtualenv missing half of
      # what this job needs.
      uses: actions/cache@v4
      with:
        path: |
          .poetry-cache
          .venv
        key: poetry-${{ runner.os }}-py3.12-dev-docs-${{ hashFiles('poetry.lock') }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "poetry==${{ env.POETRY_VERSION }}"
        poetry check --lock
        poetry install --with dev,docs
    - name: Build docs
      # `--strict` fails on a broken *internal* link, which is deterministic
      # and entirely within the repository's control, so it belongs on the
      # merge path.
      #
      # The external link check does not, and used to run here. It fetches
      # third-party URLs, so a doi.org timeout turned this job red on a pull
      # request that had not touched a link -- a failure no contributor could
      # act on, and the surest way to teach everyone that a red build means
      # nothing. It now runs on a schedule in docs-links.yml, on the same
      # reasoning performance.yml already states for itself.
      run: poetry run mkdocs build --strict

    # Uploaded from every run, so a pull request proves the artifact is
    # publishable, not merely that the build exits zero. Only the deploy job
    # below is restricted to main.
    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: site

  changelog:
    # A pull request that changes `src/` must also change CHANGELOG.md.
    #
    # Between 0.6.1 and 0.7.0, nine of the ten commits touching `src/` shipped
    # without a changelog entry -- every feature in the milestone among them.
    # The release notes had to be reconstructed from pull request descriptions
    # before 0.7.0 could be cut honestly; cutting it without noticing would
    # have shipped notes describing three commits out of twenty-six.
    #
    # `test_changelog_has_a_section_for_the_current_version` did not catch it:
    # it asserts a section *exists* for the version, not that the section
    # describes the release. Nothing else looked.
    #
    # Only `src/` changes need an entry. Documentation, CI and test-only pull
    # requests are exempt by construction rather than by judgement, which also
    # exempts Dependabot without a special case. When a source change genuinely
    # does not warrant an entry -- a pure refactor with no user-visible effect
    # -- add the `no-changelog` label, so the decision is recorded on the pull
    # request rather than made silently.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # Both endpoints of the comparison must be present; the default
        # shallow clone has neither.
        fetch-depth: 0
    - name: Require a changelog entry for source changes
      # Skipped rather than absent on push, so `ci-ok` sees this job succeed
      # instead of seeing it skipped and treating that as a failure.
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        if echo "$LABELS" | grep -q '"no-changelog"'; then
          echo "The no-changelog label is set; skipping."
          exit 0
        fi

        changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
        echo "Changed files:"
        echo "$changed" | sed 's/^/  /'

        if ! echo "$changed" | grep -q '^src/'; then
          echo "No src/ changes; a changelog entry is not required."
          exit 0
        fi
        if echo "$changed" | grep -qx 'CHANGELOG.md'; then
          echo "src/ changed and CHANGELOG.md was updated."
          exit 0
        fi

        echo "::error::This pull request changes src/ but not CHANGELOG.md."
        echo "Add an entry under '## [Unreleased]', or apply the no-changelog"
        echo "label if the change has no user-visible effect."
        exit 1

  ci-ok:
    # The single required status check for main.
    #
    # Branch protection used to name the matrix jobs directly -- "test
    # (ubuntu-latest, 3.10)" and its three siblings. That made the protection
    # settings a hidden copy of the matrix: changing either one without the
    # other either blocks every pull request on a check that will never report,
    # or silently stops requiring a job that still runs. Requiring this job
    # instead means the matrix can change freely, and adding a job to `needs`
    # is enough to make it blocking.
    #
    # `quality` and `package-smoke` are included deliberately. Neither was a
    # required check before, so a lint or type error could be merged while
    # README.md and ROADMAP.md both claimed ruff and mypy pass clean.
    if: always()
    needs: [quality, test, package-smoke, docs, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every upstream job succeeded
        # `needs` results are checked explicitly rather than relying on this
        # job being skipped: with `if: always()` it runs regardless, and a
        # cancelled or skipped dependency must not read as success.
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job reported '$result'"
              exit 1
            fi
          done
          echo "All required jobs succeeded."

  deploy-docs:
    # Publishes what the docs job already built. A second build could differ
    # from the one that was checked, and the -W gate is the thing making the
    # output trustworthy.
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
