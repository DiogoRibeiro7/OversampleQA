name: Performance

# Deliberately NOT a required pull-request check.
#
# Timing measurements on shared CI runners are noisy: a neighbouring job can
# double a wall-clock figure with no code change involved. Gating merges on that
# produces failures nobody can act on, and the predictable result is that people
# learn to ignore a red build -- which costs more than the regression detection
# is worth.
#
# So this runs on a schedule and on demand, reports what it finds, and never
# blocks a merge. Treat a failure here as a prompt to investigate, not as a gate.
on:
  schedule:
    # 04:00 UTC on Mondays.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      tolerance:
        description: "Allowed slowdown factor before a regression is reported"
        required: false
        default: "1.5"

permissions:
  contents: read

jobs:
  profile:
    name: Distance and validator profile
    runs-on: ubuntu-latest
    # Never fail the workflow run; the report is the deliverable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          # The performance extra brings psutil, without which available memory
          # is assumed to be 1 GB and batching behaves differently.
          poetry install --with dev --extras performance

      - name: Run profile
        run: |
          poetry run python scripts/profile_performance.py \
            --save perf_current.json \
            --tolerance "${{ github.event.inputs.tolerance || '1.5' }}"

      - name: Check against committed baseline
        if: hashFiles('perf_baseline.json') != ''
        run: |
          poetry run python scripts/profile_performance.py \
            --check perf_baseline.json \
            --tolerance "${{ github.event.inputs.tolerance || '1.5' }}"

      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-profile
          path: perf_current.json
          if-no-files-found: warn
